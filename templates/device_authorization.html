<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Connect GitHub | GitHarbor</title>
  <style>
    :root { color-scheme: dark; --bg: #0d1117; --surface: #161b22; --border: #30363d; --text: #f0f6fc; --muted: #8b949e; --blue: #58a6ff; }
    * { box-sizing: border-box; }
    body { display: grid; min-height: 100vh; margin: 0; place-items: center; color: var(--text); font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; background: radial-gradient(circle at 50% 0, rgba(88, 166, 255, .15), transparent 31rem), var(--bg); }
    main { width: min(100% - 32px, 510px); padding: 36px; border: 1px solid var(--border); border-radius: 10px; background: var(--surface); text-align: center; box-shadow: 0 24px 60px rgba(0, 0, 0, .28); }
    .mark { display: grid; width: 38px; height: 38px; margin: 0 auto 21px; place-items: center; border-radius: 9px; background: linear-gradient(135deg, #58a6ff, #a371f7); font-size: 20px; }
    h1 { margin: 0; font-size: 25px; letter-spacing: -.5px; }
    p { color: var(--muted); line-height: 1.55; }
    .code { margin: 25px 0 18px; padding: 17px; border: 1px solid var(--border); border-radius: 7px; background: var(--bg); color: var(--blue); font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 28px; font-weight: 700; letter-spacing: .1em; }
    .btn-primary { display: inline-flex; min-height: 39px; align-items: center; justify-content: center; padding: 0 15px; border: 1px solid rgba(240, 246, 252, .1); border-radius: 6px; background: #2ea043; color: #fff; font-size: 14px; font-weight: 600; text-decoration: none; }
    .btn-secondary { display: inline-block; margin-top: 15px; color: var(--muted); font-size: 13px; text-decoration: underline; }
    .btn-secondary:hover { color: var(--text); }
    .state { min-height: 20px; margin: 20px 0 0; font-size: 13px; }
  </style>
</head>
<body>
  <main>
    <div class="mark" aria-hidden="true">⌘</div>
    <h1>Connect your GitHub account</h1>
    <p>Open GitHub, enter this code, and approve access for GitHarbor.</p>
    <div class="code">{{ user_code }}</div>
    <a href="{{ verification_uri }}" target="_blank" rel="noopener" class="btn-primary">Open GitHub</a>
    <p class="state" id="state">Waiting for authorization…</p>
    <a href="/accounts" class="btn-secondary">← Back to Accounts</a>
  </main>
  <script>
    const statusUrl = "/github/oauth/status";
    let interval = {{ interval }} * 1000;
    const state = document.getElementById("state");

    async function checkAuthorization() {
      const response = await fetch(statusUrl, { method: "POST" });
      const data = await response.json();

      if (data.status === "authorized") {
        window.location.assign(data.redirect_url);
        return;
      }

      if (data.status === "pending") {
        interval = data.interval * 1000;
        window.setTimeout(checkAuthorization, interval);
        return;
      }

      state.textContent = "Authorization expired or was denied. Please try again.";
    }

    window.setTimeout(checkAuthorization, interval);
  </script>
</body>
</html>
